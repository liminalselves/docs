name: Deploy to deploy branch

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress
        run: npm run build

      - name: Deploy to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 拉取远程 deploy 分支，基于最新历史追加提交（保证服务器 git pull 可快进更新）
          git fetch origin deploy:deploy 2>/dev/null || true

          if git show-ref --verify --quiet refs/heads/deploy; then
            git checkout deploy
          else
            git checkout --orphan deploy
          fi

          # 清空分支上旧文件（构建产物 .vitepress/dist 未跟踪，不受影响）
          git rm -rf . --quiet 2>/dev/null || true

          # 将构建产物复制到分支根目录
          cp -r .vitepress/dist/. .

          git add -A
          # 无内容变化时跳过提交
          git diff --cached --quiet || git commit -m "deploy: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin deploy
